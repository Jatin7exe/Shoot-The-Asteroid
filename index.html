<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Among Us - Shoot the Asteroid</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b16;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 1000px;
            height: 650px;
            background: radial-gradient(circle, #1a1a2e 0%, #0d0d1a 100%);
            border: 4px solid #4a4e69;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.2);
            overflow: hidden;
            cursor: crosshair;
        }
        canvas {
            display: block;
        }
        .ui-panel {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 2px 2px #000;
            z-index: 5;
        }
        .hud-item {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 18px;
            border-radius: 6px;
            border: 2px solid #5c677d;
        }
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 11, 22, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            display: none;
        }
        h1 {
            font-size: 42px;
            color: #2ec4b6;
            margin-bottom: 10px;
            text-shadow: 3px 3px #000;
        }
        button {
            background-color: #2ec4b6;
            color: #0b0b16;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px #1b9aaa;
            transition: 0.1s;
        }
        button:hover {
            background-color: #3efff0;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 #1b9aaa;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="1000" height="650"></canvas>
        <div class="ui-panel">
            <div class="hud-item" id="score-display">Destroyed: 0</div>
            <div class="hud-item" id="timer-display">Time Left: 30s</div>
        </div>
        <div id="game-over-screen">
            <h1 id="screen-title">TASK COMPLETE</h1>
            <p id="final-score" style="font-size: 22px; margin-bottom: 20px;">Asteroids Destroyed: 0</p>
            <button onclick="restartGame()">PLAY AGAIN</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let timeLeft = 30;
    let timerInterval = null;
    let isGameOver = false;
    let gameSpeedMultiplier = 1;

    let asteroids = [];
    let particles = [];
    let spawnTimer = 0;
    let spawnInterval = 75;

    const stars = Array.from({ length: 100 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 0.5,
        alpha: Math.random()
    }));

    class Asteroid {
        constructor() {
            this.radius = Math.random() * 25 + 25;
            
            const edge = Math.floor(Math.random() * 4);
            if (edge === 0) {
                this.x = Math.random() * canvas.width;
                this.y = -this.radius;
            } else if (edge === 1) {
                this.x = canvas.width + this.radius;
                this.y = Math.random() * canvas.height;
            } else if (edge === 2) {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + this.radius;
            } else {
                this.x = -this.radius;
                this.y = Math.random() * canvas.height;
            }

            const targetX = canvas.width / 2 + (Math.random() - 0.5) * 250;
            const targetY = canvas.height / 2 + (Math.random() - 0.5) * 200;

            const angle = Math.atan2(targetY - this.y, targetX - this.x);
            const speed = (Math.random() * 1.3 + 0.8) * gameSpeedMultiplier;

            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.03;
            
            this.points = [];
            const numPoints = 8;
            for (let i = 0; i < numPoints; i++) {
                const a = (i / numPoints) * Math.PI * 2;
                const r = this.radius * (0.8 + Math.random() * 0.4);
                this.points.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
            }
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.rotation += this.rotSpeed;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.strokeStyle = '#8d99ae';
            ctx.fillStyle = '#2b2d42';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(this.points[0].x, this.points[0].y);
            for (let i = 1; i < this.points.length; i++) {
                ctx.lineTo(this.points[i].x, this.points[i].y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 4 + 1;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.alpha = 1.0;
            this.decay = Math.random() * 0.03 + 0.02;
            this.size = Math.random() * 4 + 2;
            this.color = Math.random() > 0.5 ? '#ff4d4d' : '#f77f00';
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= this.decay;
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(this.alpha, 0);
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    // ==========================================
    // HARDWARE INTEGRATION HOOK
    // ==========================================
    window.triggerShoot = function() {
        if (isGameOver || asteroids.length === 0) return;

        let targetAsteroid = asteroids[0];
        let minDist = Infinity;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        asteroids.forEach(ast => {
            const dist = Math.hypot(ast.x - centerX, ast.y - centerY);
            if (dist < minDist) {
                minDist = dist;
                targetAsteroid = ast;
            }
        });

        if (targetAsteroid) {
            destroyAsteroid(targetAsteroid);
        }
    };

    function destroyAsteroid(ast) {
        for (let i = 0; i < 15; i++) {
            particles.push(new Particle(ast.x, ast.y));
        }

        const index = asteroids.indexOf(ast);
        if (index > -1) {
            asteroids.splice(index, 1);
        }

        score++;
        gameSpeedMultiplier = 1 + Math.floor(score / 5) * 0.1;
        updateHUD();
    }

    // Click handler with correct scale mapping
    canvas.addEventListener('click', (e) => {
        if (isGameOver) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;

        for (let i = asteroids.length - 1; i >= 0; i--) {
            const ast = asteroids[i];
            const dist = Math.hypot(ast.x - mouseX, ast.y - mouseY);
            if (dist < ast.radius * 1.4) {
                destroyAsteroid(ast);
                break;
            }
        }
    });

    // Spacebar backup trigger
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            window.triggerShoot();
        }
    });

    function updateHUD() {
        document.getElementById('score-display').innerText = `Destroyed: ${score}`;
        document.getElementById('timer-display').innerText = `Time Left: ${timeLeft}s`;
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (isGameOver) return;
            timeLeft--;
            updateHUD();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                triggerGameOver();
            }
        }, 1000);
    }

    function gameLoop() {
        if (isGameOver) return;

        ctx.fillStyle = '#0b0b16';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ffffff';
        stars.forEach(star => {
            ctx.globalAlpha = Math.abs(Math.sin(Date.now() * 0.001 + star.alpha));
            ctx.fillRect(star.x, star.y, star.size, star.size);
        });
        ctx.globalAlpha = 1.0;

        spawnTimer++;
        if (spawnTimer >= spawnInterval) {
            asteroids.push(new Asteroid());
            spawnTimer = 0;
        }

        for (let i = asteroids.length - 1; i >= 0; i--) {
            const ast = asteroids[i];
            ast.update();
            ast.draw();

            // Clean up asteroids that float off screen without penalty
            if (ast.x < -150 || ast.x > canvas.width + 150 || ast.y < -150 || ast.y > canvas.height + 150) {
                asteroids.splice(i, 1);
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.update();
            p.draw();
            if (p.alpha <= 0) {
                particles.splice(i, 1);
            }
        }

        requestAnimationFrame(gameLoop);
    }

    function triggerGameOver() {
        isGameOver = true;
        document.getElementById('final-score').innerText = `Asteroids Destroyed: ${score}`;
        document.getElementById('game-over-screen').style.display = 'flex';
    }

    function restartGame() {
        score = 0;
        timeLeft = 30;
        gameSpeedMultiplier = 1;
        asteroids = [];
        particles = [];
        isGameOver = false;
        document.getElementById('game-over-screen').style.display = 'none';
        updateHUD();
        startTimer();
        gameLoop();
    }

    updateHUD();
    startTimer();
    gameLoop();
</script>
</body>
</html>
