<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Among Us - Clear Asteroids (Retro Arcade)</title>
    <!-- Importing classic pixel arcade font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            /* Wallpaper covers the whole browser window screen */
            background: url('among_us shooting.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        #console-frame {
            background: rgba(17, 19, 24, 0.92);
            padding: 20px;
            border-radius: 6px;
            border: 4px solid #333d4e;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.95), inset 0 0 20px rgba(0,255,204,0.1);
        }

        .console-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 10px;
            color: #ffb703;
            letter-spacing: 1px;
        }

        .console-header span {
            background: #050508;
            padding: 6px 10px;
            border: 2px solid #333d4e;
        }

        #game-container {
            position: relative;
            width: 1000px;
            height: 600px;
            background: #050508; /* Clean dark space background inside playing region */
            border: 4px solid #00ffcc;
            box-shadow: inset 0 0 30px rgba(0,255,204,0.15);
            overflow: hidden;
            cursor: crosshair;
        }

        /* CRT Scanline overlay effect */
        #game-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            z-index: 4;
            pointer-events: none;
        }

        canvas {
            display: block;
        }

        .ui-panel {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            pointer-events: none;
            z-index: 5;
            text-shadow: 2px 2px #000;
        }

        .hud-item {
            background: #050508;
            padding: 8px 12px;
            border: 2px solid #00ffcc;
            color: #00ffcc;
        }

        /* Overlays */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 8, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 22px;
            color: #ffb703;
            margin-bottom: 25px;
            text-shadow: 3px 3px #ff0055;
            line-height: 1.5;
        }

        p {
            color: #ffffff;
            font-size: 10px;
            margin-bottom: 35px;
            line-height: 2;
        }

        .btn-retro {
            background-color: #ff0055;
            color: #ffffff;
            border: 4px solid #ffffff;
            padding: 14px 24px;
            font-size: 12px;
            font-family: 'Press Start 2P', monospace;
            cursor: pointer;
            box-shadow: 4px 4px 0px #00ffcc;
            transition: 0.05s;
        }

        .btn-retro:hover {
            background-color: #ff3377;
        }

        .btn-retro:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #00ffcc;
        }

        .btn-secondary {
            background-color: #00ffcc;
            color: #050508;
            box-shadow: 4px 4px 0px #ff0055;
        }
        .btn-secondary:hover {
            background-color: #3effff;
        }
    </style>
</head>
<body>

    <div id="console-frame">
        <div class="console-header">
            <span>WEAPONS TASK: ASTEROIDS</span>
            <span id="task-status-header">STATUS: IDLE</span>
        </div>
        <div id="game-container">
            <canvas id="gameCanvas" width="1000" height="600"></canvas>
            
            <div class="ui-panel">
                <div class="hud-item" id="score-display">SCORE: 000</div>
                <div class="hud-item" id="timer-display">TIME: 30S</div>
            </div>

            <!-- Start Lobby Screen -->
            <div id="start-screen" class="overlay-screen">
                <h1>CLEAR ASTEROIDS</h1>
                <p>AIM YOUR POINTER & CLICK OR FIRE TO DESTROY INCOMING ROCKS.<br>SURVIVE FOR 30 SECONDS!</p>
                <button class="btn-retro btn-secondary" onclick="startGame()">START TASK</button>
            </div>

            <!-- Game Over / Complete Screen -->
            <div id="game-over-screen" class="overlay-screen" style="display: none;">
                <h1 style="color: #ff0055;">TASK COMPLETE</h1>
                <p id="final-score" style="color: #00ffcc;">ASTEROIDS DESTROYED: 0</p>
                <button class="btn-retro" onclick="closeTask()">CLOSE TASK</button>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let timeLeft = 30;
    let timerInterval = null;
    let gameRunning = false;
    let gameSpeedMultiplier = 1;

    let asteroids = [];
    let particles = [];
    let spawnTimer = 0;
    let spawnInterval = 75;

    let mouseX = canvas.width / 2;
    let mouseY = canvas.height / 2;

    class Asteroid {
        constructor() {
            this.radius = Math.random() * 20 + 22;
            
            const edge = Math.floor(Math.random() * 4);
            if (edge === 0) {
                this.x = Math.random() * canvas.width;
                this.y = -this.radius;
            } else if (edge === 1) {
                this.x = canvas.width + this.radius;
                this.y = Math.random() * canvas.height;
            } else if (edge === 2) {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + this.radius;
            } else {
                this.x = -this.radius;
                this.y = Math.random() * canvas.height;
            }

            const targetX = canvas.width / 2 + (Math.random() - 0.5) * 200;
            const targetY = canvas.height / 2 + (Math.random() - 0.5) * 150;

            const angle = Math.atan2(targetY - this.y, targetX - this.x);
            const speed = (Math.random() * 1.2 + 0.8) * gameSpeedMultiplier;

            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.04;
            
            this.points = [];
            const numPoints = 7;
            for (let i = 0; i < numPoints; i++) {
                const a = (i / numPoints) * Math.PI * 2;
                const r = this.radius * (0.75 + Math.random() * 0.5);
                this.points.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
            }
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.rotation += this.rotSpeed;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.strokeStyle = '#00ffcc';
            ctx.fillStyle = '#111827';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(this.points[0].x, this.points[0].y);
            for (let i = 1; i < this.points.length; i++) {
                ctx.lineTo(this.points[i].x, this.points[i].y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5 + 1;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.alpha = 1.0;
            this.decay = Math.random() * 0.04 + 0.02;
            this.size = Math.random() * 4 + 2;
            this.color = Math.random() > 0.5 ? '#00ffcc' : '#ff0055';
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= this.decay;
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(this.alpha, 0);
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.restore();
        }
    }

    function fireAt(x, y) {
        if (!gameRunning) return;

        for (let i = asteroids.length - 1; i >= 0; i--) {
            const ast = asteroids[i];
            const dist = Math.hypot(ast.x - x, ast.y - y);
            if (dist < ast.radius * 1.3) {
                destroyAsteroid(ast);
                break;
            }
        }
    }

    // ==========================================
    // HARDWARE INTEGRATION HOOK
    // ==========================================
    window.triggerShoot = function() {
        fireAt(mouseX, mouseY);
    };

    function destroyAsteroid(ast) {
        for (let i = 0; i < 15; i++) {
            particles.push(new Particle(ast.x, ast.y));
        }

        const index = asteroids.indexOf(ast);
        if (index > -1) {
            asteroids.splice(index, 1);
        }

        score++;
        gameSpeedMultiplier = 1 + Math.floor(score / 5) * 0.1;
        updateHUD();
    }

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        mouseX = (e.clientX - rect.left) * scaleX;
        mouseY = (e.clientY - rect.top) * scaleY;
    });

    canvas.addEventListener('click', () => {
        fireAt(mouseX, mouseY);
    });

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            window.triggerShoot();
        }
    });

    function updateHUD() {
        const formattedScore = String(score).padStart(3, '0');
        document.getElementById('score-display').innerText = `SCORE: ${formattedScore}`;
        document.getElementById('timer-display').innerText = `TIME: ${timeLeft}S`;
    }

    function startGame() {
        score = 0;
        timeLeft = 30;
        gameSpeedMultiplier = 1;
        asteroids = [];
        particles = [];
        spawnTimer = 0;
        gameRunning = true;

        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-over-screen').style.display = 'none';
        document.getElementById('task-status-header').innerText = 'STATUS: ACTIVE';

        updateHUD();
        startTimer();
        gameLoop();
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!gameRunning) return;
            timeLeft--;
            updateHUD();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endGame();
            }
        }, 1000);
    }

    function endGame() {
        gameRunning = false;
        const formattedScore = String(score).padStart(3, '0');
        document.getElementById('final-score').innerText = `ASTEROIDS DESTROYED: ${formattedScore}`;
        document.getElementById('game-over-screen').style.display = 'flex';
        document.getElementById('task-status-header').innerText = 'STATUS: COMPLETED';
    }

    function closeTask() {
        gameRunning = false;
        clearInterval(timerInterval);
        document.getElementById('game-over-screen').style.display = 'none';
        document.getElementById('start-screen').style.display = 'flex';
        document.getElementById('task-status-header').innerText = 'STATUS: IDLE';
    }

    function gameLoop() {
        if (!gameRunning) return;

        // Solid dark space fill inside the game screen so gameplay is crisp and readable
        ctx.fillStyle = '#050508';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        spawnTimer++;
        if (spawnTimer >= spawnInterval) {
            asteroids.push(new Asteroid());
            spawnTimer = 0;
        }

        for (let i = asteroids.length - 1; i >= 0; i--) {
            const ast = asteroids[i];
            ast.update();
            ast.draw();

            if (ast.x < -150 || ast.x > canvas.width + 150 || ast.y < -150 || ast.y > canvas.height + 150) {
                asteroids.splice(i, 1);
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.update();
            p.draw();
            if (p.alpha <= 0) {
                particles.splice(i, 1);
            }
        }

        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
